[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognicv"
version = "2.0.0"
description = "Batch resume screening and candidate ranking against job descriptions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Praveet Gupta" }]
keywords = ["resume", "screening", "recruiting", "nlp", "ats"]
dependencies = [
    "streamlit>=1.35.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
semantic = ["sentence-transformers>=2.6.0"]
pdf = ["pdfplumber>=0.11.0"]
dev = ["pytest>=8.0.0", "anthropic>=0.40.0"]

[project.scripts]
cognicv = "cognicv.cli:main"

[tool.setuptools]
packages = ["cognicv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
